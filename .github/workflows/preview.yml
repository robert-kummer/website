name: Preview

# Jeder Push auf main baut eine Vorschau auf GitHub Pages:
# https://robert-kummer.github.io/website/
# Die Vorschau wird für Suchmaschinen gesperrt (noindex + robots.txt).
# Gebaut wird mit build.py, siehe README.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vorschau bauen
        # --preview setzt noindex und eine robots.txt mit Disallow: /,
        # damit die Vorschau nicht mit robert-kummer.de konkurriert
        run: |
          python3 build.py --preview --base-path /website/ --out _site
          grep -q 'noindex' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
